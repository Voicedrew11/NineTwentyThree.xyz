{{ define "main" }}
  <div class="friends-webring">
    <a href="https://thekarmapolice.neocities.org/" class="footer-webring-arrow" rel="noopener noreferrer" target="_blank" aria-label="Previous site">&lt;</a>
    <a href="https://risingthumb.github.io/Travelers-of-Agora-Road-webring/" rel="noopener noreferrer" target="_blank" aria-label="Travelers of Agora Road webring">
      <img src="https://risingthumb.github.io/Travelers-of-Agora-Road-webring/img/traveller.png" alt="Travelers of Agora Road webring">
    </a>
  </div>
  {{ .Content }}
  {{ with site.Data.friends }}
    <div class="friends-list">
      {{ range . }}
        <a href="{{ .url }}" class="friend-btn" rel="noopener noreferrer" target="_blank" title="{{ .name }}">
          <img src="{{ .image }}" width="88" height="31" alt="88×31 button: {{ .name }}">
        </a>
      {{ end }}
    </div>
  {{ else }}
    <p class="friends-empty">No friends yet.</p>
  {{ end }}
{{ end }}
